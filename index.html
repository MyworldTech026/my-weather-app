<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="weather.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="app">

    <div class="top-bar">
      <span class="brand">SKIES</span>
      <span class="tagline">live weather</span>
    </div>

    <div class="search-wrap">
      <input type="text" class="js-city-input" placeholder="Enter city name..." />
      <button class="js-search-btn search-btn">GO</button>
    </div>

    <div class="js-alert alert hidden"></div>

    <div class="js-weather-card weather-card hidden"></div>

    <div class="decoration">
      <div class="circle c1"></div>
      <div class="circle c2"></div>
      <div class="circle c3"></div>
    </div>

  </div>

  <script src="weather.js"></script>
</body>
</html>
